name: PR 62 isolated preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr62-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Pin and verify the current PR 62 head
        id: source
        env:
          SOURCE_SHA: 6ba4fc5b695fd740d1c1608914a033eaca651b07
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = process.env.SOURCE_SHA;
          if (!/^[0-9a-f]{40}$/.test(expected)) throw new Error('Invalid pinned source SHA');
          const response = await fetch('https://api.github.com/repos/LuceatLuxVestra42/Langrisser-2nd-test/pulls/63', {
            headers: { accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error(`PR lookup failed: ${response.status}`);
          const pr = await response.json();
          if (pr.state !== 'open' || pr.head.sha !== expected) {
            throw new Error(`PR 62 head changed or is not open; expected ${expected}, got ${pr.head.sha}`);
          }
          NODE
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          git init source
          git -C source remote add origin https://github.com/LuceatLuxVestra42/Langrisser-2nd-test.git
          git -C source fetch --depth=1 origin refs/pull/63/head
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate exact source build
        working-directory: source
        run: node tools/build.mjs

      - name: Assemble the approved static file allowlist
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../site/generated ../site/assets/portraits
          cp index.html app.js styles.css ../site/
          cp generated/hero-slice.v1.json generated/hero-soldier-relations.v1.json \
            generated/normal-soldiers.v1.json generated/sp-soldiers.v1.json \
            generated/job-glossary.v1.json generated/general-ssr-equipment.v1.json \
            generated/exclusive-equipment.v1.json ../site/generated/
          cp assets/portraits/hero-5.png assets/portraits/hero-6.png \
            assets/portraits/hero-8.png assets/portraits/hero-28.png \
            assets/portraits/hero-32.png assets/portraits/hero-52.png \
            assets/portraits/hero-53.png ../site/assets/portraits/
          cat > ../expected-files.txt <<'FILES'
          app.js
          assets/portraits/hero-28.png
          assets/portraits/hero-32.png
          assets/portraits/hero-5.png
          assets/portraits/hero-52.png
          assets/portraits/hero-53.png
          assets/portraits/hero-6.png
          assets/portraits/hero-8.png
          generated/exclusive-equipment.v1.json
          generated/general-ssr-equipment.v1.json
          generated/hero-slice.v1.json
          generated/hero-soldier-relations.v1.json
          generated/job-glossary.v1.json
          generated/normal-soldiers.v1.json
          generated/sp-soldiers.v1.json
          index.html
          styles.css
          FILES
          (cd ../site && find . -type f -printf '%P\n' | LC_ALL=C sort) > ../actual-files.txt
          diff -u ../expected-files.txt ../actual-files.txt
          test -z "$(find ../site -type l -print -quit)"
          printf '%s\n' "$SOURCE_SHA" > ../provenance.txt
          (cd .. && find site -type f -print0 | sort -z | xargs -0 sha256sum > files.sha256)

      - name: Upload verified static artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr62-static-site
          path: |
            site/
            provenance.txt
            files.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure isolated GitHub Pages deployment
        uses: actions/configure-pages@v5

      - name: Download the static artifact only
        uses: actions/download-artifact@v4
        with:
          name: pr62-static-site
          path: artifact

      - name: Verify artifact allowlist, provenance, and file hashes
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(cat artifact/provenance.txt)" = "$EXPECTED_SOURCE_SHA"
          cd artifact
          cat > expected-files.txt <<'FILES'
          app.js
          assets/portraits/hero-28.png
          assets/portraits/hero-32.png
          assets/portraits/hero-5.png
          assets/portraits/hero-52.png
          assets/portraits/hero-53.png
          assets/portraits/hero-6.png
          assets/portraits/hero-8.png
          generated/exclusive-equipment.v1.json
          generated/general-ssr-equipment.v1.json
          generated/hero-slice.v1.json
          generated/hero-soldier-relations.v1.json
          generated/job-glossary.v1.json
          generated/normal-soldiers.v1.json
          generated/sp-soldiers.v1.json
          index.html
          styles.css
          FILES
          (cd site && find . -type f -printf '%P\n' | LC_ALL=C sort) > actual-files.txt
          diff -u expected-files.txt actual-files.txt
          test -z "$(find site -type l -print -quit)"
          sha256sum -c files.sha256

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact/site

      - name: Deploy isolated Pages site
        id: deploy
        uses: actions/deploy-pages@v4
